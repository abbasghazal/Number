services:
  - type: web
    name: shahem-store-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: DB_PATH
        value: database/KingA.db
